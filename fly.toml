# Fly.io config for the Classic Bingo web app.
#   fly launch --no-deploy --copy-config   (pick an app name; keep this file)
#   fly volumes create bingo_data --size 1 --region sin
#   fly deploy
#   fly ips allocate-v4            # dedicated IPv4 so phones can dial TCP 7575 (about $2/month)
#   fly secrets set PUBLIC_HOST=<that IPv4> PUBLIC_URL=https://<app>.fly.dev
#   fly scale count 1              # never more than one machine: the lobby is in memory
app = "classic-bingo-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  BINGO_DATA_DIR = "/data"

# Browsers: the web app over HTTPS (WebSocket included).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Phones: the Classic Bingo app dials raw TCP 7575.
[[services]]
  protocol = "tcp"
  internal_port = 7575
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7575

[mounts]
  source = "bingo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
